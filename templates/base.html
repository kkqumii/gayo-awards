<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAYO AWARDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-image: linear-gradient(rgba(8, 8, 10, 0.9), rgba(8, 8, 10, 0.9)), url("{{ url_for('static', filename='background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f8f8f8;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ШАПКА */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(229, 192, 123, 0.15);
            background: #08080a; 
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 2px;
        }

        /* ГАМБУРГЕР (на компьютере скрыт) */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #e5c07b;
            transition: all 0.3s;
        }

        /* МЕНЮ */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #e5c07b;
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 65px;
                right: 20px;
                background: #111115;
                border: 1px solid rgba(229, 192, 123, 0.3);
                padding: 20px;
                border-radius: 4px;
                gap: 15px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                font-size: 0.9rem;
            }
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .content {
            flex: 1;
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            color: #e5c07b;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* ГРАДИЕНТНЫЙ ТЕКСТ */
        .gold-gradient-text {
            background: linear-gradient(90deg, #e5c07b, #f3d79b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            display: inline-block;
        }
        
        /* ТАЙМЕР И КАРТОЧКИ (оставил как было) */
        .timer-wrapper { padding: 20px 20px 0 20px; display: flex; justify-content: center; }
        .timer-container { background: #111115; border: 1px solid rgba(229, 192, 123, 0.3); border-radius: 8px; padding: 20px 30px; width: 100%; max-width: 600px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .timer-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #a0a0a0; margin-bottom: 15px; }
        .timer-clock { display: flex; justify-content: center; gap: 20px; }
        .time-box { display: flex; flex-direction: column; align-items: center; }
        .time-number { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: #e5c07b; line-height: 1; margin-bottom: 5px; text-shadow: 0 0 15px rgba(229, 192, 123, 0.3); }
        .time-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(229, 192, 123, 0.15); padding: 20px; margin-bottom: 15px; border-radius: 4px; }
        .grid-team { display: flex; flex-direction: column; gap: 15px; }
        
        @media (min-width: 768px) {
            .grid-team { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo gold-gradient-text">GAYO AWARDS</a>
        
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="mobile-menu">
            <a href="/">О премии</a>
            <a href="/academy">GAYO Academy</a>
            <a href="/nominations">Номинации</a>
        </div>
    </nav>

    <!-- ТАЙМЕР -->
    <div class="timer-wrapper">
        <div class="timer-container">
            <p class="timer-title">До закрытия голосования</p>
            <div class="timer-clock">
                <div class="time-box">
                    <span id="days" class="time-number">00</span>
                    <span class="time-label">дней</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="time-number">00</span>
                    <span class="time-label">часов</span>
                </div>
                <div class="time-box">
                    <span id="minutes" class="time-number">00</span>
                    <span class="time-label">минут</span>
                </div>
                <div class="time-box">
                    <span id="seconds" class="time-number">00</span>
                    <span class="time-label">секунд</span>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('active');
        }

        const deadline = new Date("2026-12-04T21:00:00").getTime();
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = deadline - now;
            if (distance < 0) {
                clearInterval(timer);
                document.querySelector('.timer-clock').innerHTML = "<h2 style='color:#e5c07b; font-family: Cormorant Garamond'>Голосование завершено</h2>";
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);
    </script>
</body>
</html>
